worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # Large upload support (up to 4GB videos)
    client_max_body_size 4096M;
    client_body_buffer_size 128M;
    client_header_buffer_size 16k;
    large_client_header_buffers 4 32k;

    # Gzip Compression for text, JSON, and JS/CSS
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    upstream scenemind_app {
        server app:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # ----------------------------------------------------------------------
        # High-Speed Direct Media Streaming (Bypasses Node.js stream overhead)
        # ----------------------------------------------------------------------
        location /api/media/ {
            alias /var/www/storage/;
            
            # Kernel-level file streaming
            sendfile on;
            sendfile_max_chunk 4m;
            tcp_nopush on;
            tcp_nodelay on;

            # HTTP 206 Partial Content / Byte-Ranges for instant seeking
            add_header Accept-Ranges bytes;
            add_header Cache-Control "public, max-age=604800, immutable";

            # CORS headers for media streaming
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Range, Content-Type, Authorization";
            add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges";

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            try_files $uri =404;
        }

        # ----------------------------------------------------------------------
        # Next.js Static Assets Caching
        # ----------------------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://scenemind_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ----------------------------------------------------------------------
        # Main App & API Reverse Proxy
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://scenemind_app;
            proxy_http_version 1.1;

            # WebSocket & SSE Support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long timeouts for AI processing, indexing & large file uploads
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            send_timeout 600s;

            # Buffer settings for responsive streaming
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
