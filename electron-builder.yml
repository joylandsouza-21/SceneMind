appId: com.scenemind.ai
productName: SceneMind
executableName: scenemind
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
directories:
  output: dist

icon: build/icon.png

asar: false
npmRebuild: false
nodeGypRebuild: false

files:
  - electron/**/*
  - .next/standalone/**/*
  - package.json
  - "!node_modules"
  - "!node_modules/**/*"
  - "!storage"
  - "!storage/**/*"
  - "!data"
  - "!data/**/*"
  - "!.next/standalone/storage"
  - "!.next/standalone/storage/**/*"
  - "!.next/standalone/data"
  - "!.next/standalone/data/**/*"

linux:
  icon: build/icons
  target:
    - deb
  maintainer: "SceneMind Team <dev@scenemind.local>"
  category: AudioVideo
  synopsis: AI Video Search & Scene Intelligence

deb:
  depends:
    - ffmpeg

win:
  icon: build/icon.ico
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
