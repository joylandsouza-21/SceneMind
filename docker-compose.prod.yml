# ==============================================================================
# SceneMind AI — Production Docker Compose (Pre-built Images)
#
# Usage:
#   1. Build & tag the app image on your dev machine:
#      docker build -t scenemind-app:latest .
#
#   2. Save images for transfer:
#      docker save scenemind-app:latest nginx:alpine pgvector/pgvector:pg16 redis:7-alpine | gzip > scenemind-images.tar.gz
#
#   3. On the target system, load images:
#      docker load < scenemind-images.tar.gz
#
#   4. Copy this file + docker/ folder to the target, then run:
#      docker compose -f docker-compose.prod.yml up -d
#
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Reverse Proxy & Accelerated Video Streaming (Nginx)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: scenemind_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - scenemind_storage:/var/www/storage:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - scenemind_net

  # ----------------------------------------------------------------------------
  # 2. Main Video AI Application (Pre-built Image)
  # ----------------------------------------------------------------------------
  app:
    image: scenemind-app:latest
    container_name: scenemind_app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_OPTIONS=${NODE_OPTIONS:---max-old-space-size=4096}
      # AI Model Settings
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-text-embedding-001}
      # Vector & Database Credentials
      - VECTOR_STORE_PROVIDER=${VECTOR_STORE_PROVIDER:-pgvector}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-scenemind_admin}:${POSTGRES_PASSWORD:-scenemind_vault_secure_2026}@postgres:5432/${POSTGRES_DB:-scenemind_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-scenemind_redis_vault_2026}@redis:6379
      # Storage Path inside container
      - STORAGE_DIR=/app/storage
      - DATA_DIR=/app/data
    volumes:
      - scenemind_storage:/app/storage
      - scenemind_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/videos || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - scenemind_net

  # ----------------------------------------------------------------------------
  # 3. Vector Database (PostgreSQL 16 with pgvector extension)
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: scenemind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scenemind_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scenemind_vault_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-scenemind_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - scenemind_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scenemind_admin} -d ${POSTGRES_DB:-scenemind_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scenemind_net

  # ----------------------------------------------------------------------------
  # 4. In-Memory Cache & Task Queue (Redis)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: scenemind_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-scenemind_redis_vault_2026}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - scenemind_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-scenemind_redis_vault_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scenemind_net

# ------------------------------------------------------------------------------
# Persistent Docker Volumes
# ------------------------------------------------------------------------------
volumes:
  scenemind_storage:
    name: scenemind_storage
  scenemind_data:
    name: scenemind_data
  scenemind_pgdata:
    name: scenemind_pgdata
  scenemind_redis_data:
    name: scenemind_redis_data

# ------------------------------------------------------------------------------
# Bridge Network
# ------------------------------------------------------------------------------
networks:
  scenemind_net:
    name: scenemind_network
    driver: bridge
